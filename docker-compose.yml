version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memekita_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000","9001:9001"]
    volumes: ["miniodata:/data"]
    mem_limit: 128m

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/memekita_dev?sslmode=disable
      R2_ENDPOINT: http://minio:9000
      R2_BUCKET: memekita-media
      R2_ACCESS_KEY: minioadmin
      R2_SECRET_KEY: minioadmin123
      CDN_URL: http://localhost:9000/memekita-media
      JWT_SECRET: dev_secret_key_change_in_prod_32chars!!
      GRPC_PORT: 50051
      HTTP_PORT: 4000
    ports: ["4000:4000","50051:50051"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    command: /server

volumes:
  pgdata:
  miniodata:
