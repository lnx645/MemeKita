version: v1
plugins:
  - plugin: buf.build/protocolbuffers/go
    out: ../backend/proto/gen
    opt: paths=source_relative
  - plugin: buf.build/grpc/go
    out: ../backend/proto/gen
    opt: paths=source_relative
  - plugin: buf.build/grpc/kotlin
    out: ../android/app/src/main/java
    opt: lite=false
