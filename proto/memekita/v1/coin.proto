syntax = "proto3";
package memekita.v1;

option java_package = "com.meme_kita.mobile.proto";
option java_multiple_files = true;

service CoinService {
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse);
  rpc ConfirmTopUp(ConfirmTopUpRequest) returns (ConfirmTopUpResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
}

message CoinPackage {
  string id = 1;
  int64 coins = 2;
  int64 price_idr = 3;
  string play_sku = 4;
  bool is_active = 5;
}

message ListPackagesRequest {}

message ListPackagesResponse {
  repeated CoinPackage packages = 1;
}

message ConfirmTopUpRequest {
  string package_id = 1;
  string purchase_token = 2;
  string play_sku = 3;
}

message ConfirmTopUpResponse {
  bool success = 1;
  int64 new_balance = 2;
  string transaction_id = 3;
}

message GetBalanceRequest {}

message GetBalanceResponse {
  int64 balance = 1;
}

message CoinTransaction {
  string id = 1;
  string type = 2;
  int64 amount_coins = 3;
  int64 balance_after = 4;
  string ref_id = 5;
  string created_at = 6;
}

message ListTransactionsRequest {
  string cursor = 1;
  int32 limit = 2;
}

message ListTransactionsResponse {
  repeated CoinTransaction transactions = 1;
  string next_cursor = 2;
  bool has_more = 3;
}
