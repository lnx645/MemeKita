name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint proto
      - run: buf breaking proto --against '.git#branch=main,subdir=proto'
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: memekita_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: gofmt -l . | grep . && exit 1 || echo "gofmt ok"
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - uses: golangci/golangci-lint-action@v6
        with: { version: v1.59, args: --timeout=5m }
        env: { working-directory: backend }
      - run: go test ./... -p 1 -race -count=1
        working-directory: backend
        env: { DATABASE_URL: postgres://postgres:postgres@localhost:5432/memekita_test?sslmode=disable }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: ./gradlew testDebugUnitTest --info
        working-directory: android
      - run: ./gradlew lint
        working-directory: android
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: admin
      - run: npm run lint
        working-directory: admin
      - run: npm run build
        working-directory: admin
        env: { NODE_OPTIONS: --max-old-space-size=512 }
  no-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -r "TODO\|FIXME\|notImplemented\|stub" --include="*.go" --include="*.kt" --include="*.tsx" backend android admin; then echo "Stub ditemukan!"; exit 1; fi
